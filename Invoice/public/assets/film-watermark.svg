<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wmReelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a" />
      <stop offset="40%" stop-color="#5a5a5a" />
      <stop offset="70%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#4a4a4a" />
    </linearGradient>
    <linearGradient id="wmGoldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a68026" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7a5710" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <g opacity="0.12">
    <!-- Tilted Clapperboard -->
    <g transform="translate(140, 90) rotate(-18)">
      <!-- Board body -->
      <rect x="0" y="28" width="140" height="95" rx="4" fill="#2b2d31" stroke="#4a4e58" stroke-width="1.5" />
      
      <!-- Slate lines -->
      <line x1="8" y1="58" x2="132" y2="58" stroke="#686d79" stroke-width="1" />
      <line x1="8" y1="88" x2="132" y2="88" stroke="#686d79" stroke-width="1" />
      <line x1="50" y1="28" x2="50" y2="58" stroke="#686d79" stroke-width="1" />
      <line x1="90" y1="28" x2="90" y2="58" stroke="#686d79" stroke-width="1" />
      <line x1="70" y1="58" x2="70" y2="88" stroke="#686d79" stroke-width="1" />
      
      <!-- Subtle text labels -->
      <text x="12" y="44" font-family="sans-serif" font-size="7" fill="#888e9b" font-weight="bold">PROD.</text>
      <text x="12" y="74" font-family="sans-serif" font-size="7" fill="#888e9b" font-weight="bold">SCENE</text>
      <text x="75" y="74" font-family="sans-serif" font-size="7" fill="#888e9b" font-weight="bold">TAKE</text>
      <text x="12" y="106" font-family="sans-serif" font-size="7" fill="#888e9b" font-weight="bold">DIRECTOR</text>

      <!-- Clapper stick (top) -->
      <g>
        <rect x="0" y="0" width="140" height="26" rx="3" fill="#1e2024" stroke="#4a4e58" stroke-width="1.5" />
        <!-- White diagonal stripes -->
        <polygon points="12,0 26,0 14,26 0,26" fill="#e6e8ee" />
        <polygon points="42,0 56,0 44,26 30,26" fill="#e6e8ee" />
        <polygon points="72,0 86,0 74,26 60,26" fill="#e6e8ee" />
        <polygon points="102,0 116,0 104,26 90,26" fill="#e6e8ee" />
        <polygon points="132,0 140,0 134,26 120,26" fill="#e6e8ee" />
      </g>
    </g>

    <!-- 35mm Film Reel -->
    <g transform="translate(330, 160)">
      <!-- Outer rim -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="url(#wmReelGrad)" stroke-width="9" />
      <circle cx="0" cy="0" r="79" fill="none" stroke="#222" stroke-width="1.5" />
      <circle cx="0" cy="0" r="70" fill="none" stroke="#222" stroke-width="1.5" />
      
      <!-- Inner circular plate -->
      <circle cx="0" cy="0" r="54" fill="#303236" stroke="#4f5258" stroke-width="2" />
      
      <!-- Center Spindle & Hub -->
      <circle cx="0" cy="0" r="22" fill="#1f2022" stroke="url(#wmGoldAccent)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="9" fill="#111" />
      <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.6" />

      <!-- 6 circular reel cutouts -->
      <g>
        <circle cx="0" cy="-36" r="11" fill="#f8f9fa" stroke="#222" stroke-width="1.5" />
        <circle cx="31.1" cy="-18" r="11" fill="#f8f9fa" stroke="#222" stroke-width="1.5" />
        <circle cx="31.1" cy="18" r="11" fill="#f8f9fa" stroke="#222" stroke-width="1.5" />
        <circle cx="0" cy="36" r="11" fill="#f8f9fa" stroke="#222" stroke-width="1.5" />
        <circle cx="-31.1" cy="18" r="11" fill="#f8f9fa" stroke="#222" stroke-width="1.5" />
        <circle cx="-31.1" cy="-18" r="11" fill="#f8f9fa" stroke="#222" stroke-width="1.5" />
      </g>
    </g>

    <!-- Flowing Curving Filmstrip with Frames & Sprocket holes -->
    <g transform="translate(100, 30) rotate(14)">
      <!-- Strip path -->
      <path d="M 0 100 C 120 70, 260 130, 380 90 C 420 78, 460 70, 500 75" fill="none" stroke="#26282c" stroke-width="36" stroke-linecap="round" />
      <!-- Film frames -->
      <path d="M 0 100 C 120 70, 260 130, 380 90 C 420 78, 460 70, 500 75" fill="none" stroke="#f4f5f7" stroke-width="24" stroke-dasharray="28 6" stroke-linecap="butt" />
      <!-- Upper sprocket holes -->
      <path d="M 0 85 C 120 55, 260 115, 380 75 C 420 63, 460 55, 500 60" fill="none" stroke="#f4f5f7" stroke-width="2" stroke-dasharray="3 4" />
      <!-- Lower sprocket holes -->
      <path d="M 0 115 C 120 85, 260 145, 380 105 C 420 93, 460 85, 500 90" fill="none" stroke="#f4f5f7" stroke-width="2" stroke-dasharray="3 4" />
    </g>
  </g>
</svg>