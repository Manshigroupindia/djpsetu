<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="botGoldGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e3304" />
      <stop offset="25%" stop-color="#aa7c11" />
      <stop offset="45%" stop-color="#fcedb9" />
      <stop offset="70%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#694605" />
    </linearGradient>
    <linearGradient id="botGoldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#8a6114" />
      <stop offset="100%" stop-color="#2e1d02" />
    </linearGradient>
    <linearGradient id="botDarkWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141518" />
      <stop offset="50%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="reelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ba43" />
      <stop offset="30%" stop-color="#fdf4d6" />
      <stop offset="60%" stop-color="#b6891e" />
      <stop offset="90%" stop-color="#6a4a06" />
    </linearGradient>
    <filter id="botShadow" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Flowing Upper Golden Wave Accent -->
  <path d="M 0 160 C 140 110, 320 180, 520 130 C 640 100, 720 70, 800 50 L 800 240 L 0 240 Z" fill="url(#botGoldGrad1)" />

  <!-- Flowing Main Dark Wave -->
  <path d="M 0 175 C 160 135, 340 195, 540 145 C 660 115, 740 90, 800 75 L 800 240 L 0 240 Z" fill="url(#botDarkWave)" filter="url(#botShadow)" />

  <!-- Shimmering Thin Gold Wave Crest -->
  <path d="M 0 174 C 160 134, 340 194, 540 144 C 660 114, 740 89, 800 74" fill="none" stroke="url(#botGoldGrad2)" stroke-width="2.5" />
  <path d="M 0 160 C 140 110, 320 180, 520 130 C 640 100, 720 70, 800 50" fill="none" stroke="#fff8e7" stroke-width="1.2" opacity="0.8" />

  <!-- Filmstrip running along the right side of dark wave -->
  <g transform="translate(560, 60) rotate(-14)">
    <!-- Base strip -->
    <path d="M 0 60 C 80 50, 160 40, 260 25" fill="none" stroke="#121316" stroke-width="26" />
    <!-- Frames -->
    <path d="M 0 60 C 80 50, 160 40, 260 25" fill="none" stroke="#333740" stroke-width="18" stroke-dasharray="22 5" />
    <!-- Sprockets top and bottom -->
    <path d="M 0 50 C 80 40, 160 30, 260 15" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />
    <path d="M 0 70 C 80 60, 160 50, 260 35" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />
  </g>

  <!-- 35mm Golden Film Reel on Bottom-Left Corner -->
  <g transform="translate(45, 175) scale(0.72)">
    <!-- Outer Golden Rim -->
    <circle cx="0" cy="0" r="68" fill="none" stroke="url(#reelGold)" stroke-width="8" filter="url(#botShadow)" />
    <circle cx="0" cy="0" r="72" fill="none" stroke="#3a2403" stroke-width="1.2" />
    <circle cx="0" cy="0" r="64" fill="none" stroke="#3a2403" stroke-width="1.2" />

    <!-- Reel Plate -->
    <circle cx="0" cy="0" r="50" fill="#1b1c1e" stroke="url(#reelGold)" stroke-width="1.8" />

    <!-- Center Spindle & Golden Hub -->
    <circle cx="0" cy="0" r="20" fill="url(#reelGold)" stroke="#222" stroke-width="1.5" />
    <circle cx="0" cy="0" r="8" fill="#111" />
    <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.7" />

    <!-- Circular Cutout Spokes -->
    <circle cx="0" cy="-33" r="10" fill="url(#botDarkWave)" stroke="url(#reelGold)" stroke-width="1.5" />
    <circle cx="28.5" cy="-16.5" r="10" fill="url(#botDarkWave)" stroke="url(#reelGold)" stroke-width="1.5" />
    <circle cx="28.5" cy="16.5" r="10" fill="url(#botDarkWave)" stroke="url(#reelGold)" stroke-width="1.5" />
    <circle cx="0" cy="33" r="10" fill="url(#botDarkWave)" stroke="url(#reelGold)" stroke-width="1.5" />
    <circle cx="-28.5" cy="16.5" r="10" fill="url(#botDarkWave)" stroke="url(#reelGold)" stroke-width="1.5" />
    <circle cx="-28.5" cy="-16.5" r="10" fill="url(#botDarkWave)" stroke="url(#reelGold)" stroke-width="1.5" />
  </g>

  <!-- Bottom Dark Footer Bar -->
  <rect x="0" y="202" width="800" height="38" fill="#08080a" />
  <line x1="0" y1="202" x2="800" y2="202" stroke="#d4af37" stroke-width="1.2" />

  <!-- Bottom Footer Bar Text -->
  <g fill="#e5c07b" font-family="'Montserrat', 'Trebuchet MS', sans-serif" font-size="11.5" font-weight="600" letter-spacing="1">
    <!-- Star -->
    <text x="56" y="225" font-size="14" fill="#d4af37">★</text>
    <text x="80" y="225">Deven Jha Productions</text>
    <line x1="290" y1="210" x2="290" y2="232" stroke="#5a4515" stroke-width="1" />
    <text x="345" y="225">Professional Services</text>
    <line x1="535" y1="210" x2="535" y2="232" stroke="#5a4515" stroke-width="1" />
    <text x="595" y="225">Creative Excellence</text>
  </g>
</svg>